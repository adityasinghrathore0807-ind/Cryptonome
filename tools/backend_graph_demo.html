<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cryptonome - Wallet Investigation</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px;
            background: #0b1120;
            color: #e5e7eb;
            font-family: Arial, sans-serif;
        }

        h1 {
            margin-bottom: 6px;
        }

        .subtitle {
            color: #94a3b8;
            margin-bottom: 22px;
        }

        .toolbar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        input {
            flex: 1;
            min-width: 220px;
            padding: 12px;
            border: 1px solid #334155;
            border-radius: 8px;
            background: #111827;
            color: white;
        }

        button {
            padding: 11px 16px;
            border: 0;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        #searchWallet {
            background: #2563eb;
            color: white;
        }

        #clearSearch {
            background: #334155;
            color: white;
        }

        #searchStatus {
            min-height: 22px;
            margin-bottom: 12px;
            color: #94a3b8;
        }

        .workspace {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 300px;
            gap: 16px;
            align-items: start;
        }

        #graph {
            width: 100%;
            min-height: 520px;
            border: 1px solid #263449;
            border-radius: 12px;
            background: #0f172a;
            overflow: hidden;
        }

        .panel {
            padding: 18px;
            border: 1px solid #263449;
            border-radius: 12px;
            background: #111827;
        }

        .panel h2 {
            margin-top: 0;
            font-size: 18px;
        }

        .detail {
            padding: 11px 0;
            border-bottom: 1px solid #263449;
        }

        .detail-label {
            display: block;
            margin-bottom: 5px;
            color: #94a3b8;
            font-size: 12px;
        }

        .detail-value {
            overflow-wrap: anywhere;
            font-size: 13px;
            color: #e2e8f0;
        }

        .empty {
            color: #94a3b8;
            font-size: 13px;
            line-height: 1.6;
        }

        .info {
            margin-top: 14px;
            padding: 12px;
            background: #111827;
            border: 1px solid #263449;
            border-radius: 8px;
            color: #94a3b8;
        }

        @media (max-width: 850px) {
            .workspace {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <h1>Cryptonome Graph Explorer</h1>

    <div class="subtitle">
        Backend 1 transaction graph and wallet investigation.
    </div>

    <div class="toolbar">
        <input id="walletSearch" type="text" placeholder="Search wallet address or label...">
        <button id="searchWallet">Search Wallet</button>
        <button id="clearSearch">Clear</button>
    </div>

    <div id="searchStatus">Loading graph...</div>

    <div class="workspace">

        <div id="graph"></div>

        <aside class="panel">
            <h2>Investigation Details</h2>

            <div id="details" class="empty">
                Select a wallet, transaction, IP address or ASN
                in the graph to inspect its details.
            </div>
        </aside>

    </div>

    <div class="info">
        Interactive graph loaded from real Backend 1 data.
    </div>

    <script src="../src/cryptonome/dashboard/static/graph.js"></script>
    <script src="../src/cryptonome/dashboard/static/backend_adapter.js"></script>

    <script>
        let graphData = null;

        const status = document.getElementById("searchStatus");
        const details = document.getElementById("details");
        const searchInput = document.getElementById("walletSearch");

        async function loadBackendGraph() {
            try {
                const response = await fetch(
                    "../sample_data/backend_graph.json"
                );

                if (!response.ok) {
                    throw new Error("Could not load backend_graph.json");
                }

                const rawData = await response.json();

                graphData =
                    window.CryptonomeBackendAdapter.convertGraph(rawData);

                renderGraph();

                status.textContent =
                    "Loaded " + graphData.nodes.length +
                    " nodes and " + graphData.edges.length + " edges.";

            } catch (error) {
                status.textContent = "Error: " + error.message;
                console.error(error);
            }
        }

        function renderGraph() {
            const container = document.getElementById("graph");
            container.innerHTML = "";

            window.CryptonomeGraph.render(
                container,
                graphData,
                {
                    height: 520,
                    onSelect: selectNode
                }
            );
        }

        function addDetail(label, value) {
            const item = document.createElement("div");
            item.className = "detail";

            const heading = document.createElement("span");
            heading.className = "detail-label";
            heading.textContent = label;

            const content = document.createElement("div");
            content.className = "detail-value";
            content.textContent =
                value === undefined || value === null || value === ""
                    ? "Not available"
                    : String(value);

            item.appendChild(heading);
            item.appendChild(content);
            details.appendChild(item);
        }

        function selectNode(node) {
            details.innerHTML = "";

            addDetail("Node type", node.kind);
            addDetail("Node ID", node.id);
            addDetail("Label", node.label);

            addDetail("Country", node.country);
            addDetail("City", node.city);
            addDetail("ASN", node.asn);
            addDetail("Organization", node.org);

            addDetail("Transaction amount (BTC)", node.amount);
            addDetail("Timestamp", node.timestamp);

            const connectedEdges = graphData.edges.filter(edge =>
                edge.s === node.id || edge.t === node.id
            );

            const connectedIds = new Set();

            connectedEdges.forEach(edge => {
                connectedIds.add(
                    edge.s === node.id ? edge.t : edge.s
                );
            });

            addDetail("Connections", connectedIds.size);
            addDetail("Connected edges", connectedEdges.length);

            status.textContent =
                "Selected " + node.kind + ": " + node.label;

            console.log("Selected node:", node);
            console.log("Connected edges:", connectedEdges);
        }

        function searchWallet() {
            if (!graphData) return;

            const query = searchInput.value.trim().toLowerCase();

            if (!query) {
                status.textContent = "Enter a wallet address to search.";
                return;
            }

            const matches = graphData.nodes.filter(node =>
                node.kind === "wallet" &&
                (
                    String(node.id || "").toLowerCase().includes(query) ||
                    String(node.label || "").toLowerCase().includes(query)
                )
            );

            if (matches.length === 0) {
                status.textContent = "No matching wallet found: " + query;
                return;
            }

            selectNode(matches[0]);

            status.textContent =
                "Found " + matches.length +
                " wallet match(es). Showing the first match.";
        }

        function clearSearch() {
            searchInput.value = "";

            details.innerHTML =
                '<div class="empty">Select a node in the graph to inspect its details.</div>';

            status.textContent =
                graphData
                    ? "Loaded " + graphData.nodes.length +
                    " nodes and " + graphData.edges.length + " edges."
                    : "Loading graph...";
        }

        document
            .getElementById("searchWallet")
            .addEventListener("click", searchWallet);

        document
            .getElementById("clearSearch")
            .addEventListener("click", clearSearch);

        searchInput.addEventListener("keydown", event => {
            if (event.key === "Enter") searchWallet();
        });

        loadBackendGraph();
    </script>

</body>

</html>
