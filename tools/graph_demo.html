<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cryptonome Graph Demo</title>
</head>

<body style="margin:20px;font-family:system-ui,sans-serif;background:#fff">
    <h3>Cryptonome graph.js demo with a hand-made payload</h3>

    <p style="color:#64748b;font-size:13px">
        Hover a node, scroll to zoom, drag to pan, and click a node to view its details below.
    </p>

    <div id="g"></div>

    <pre id="log"
        style="background:#f1f5f9;padding:8px;font-size:12px;white-space:pre-wrap">Select a node to view its details.</pre>

    <script src="../src/cryptonome/dashboard/static/graph.js"></script>
    <script>
        var payload = {
            focus: "w:walletA",
            nodes: [
                {
                    id: "w:walletA",
                    kind: "wallet",
                    label: "walletA",
                    full: "bc1qdemoWalletAaaaaaaaaaaaaaaaaaaaaaaaaa",
                    risk: 0.91,
                    x: 0.50,
                    y: 0.50
                },
                {
                    id: "w:walletB",
                    kind: "wallet",
                    label: "walletB",
                    full: "bc1qdemoWalletBbbbbbbbbbbbbbbbbbbbbbbbbb",
                    risk: 0.40,
                    x: 0.15,
                    y: 0.25
                },
                {
                    id: "w:walletC",
                    kind: "wallet",
                    label: "walletC",
                    full: "bc1qdemoWalletCccccccccccccccccccccccccc",
                    risk: null,
                    x: 0.85,
                    y: 0.25
                },
                {
                    id: "t:tx1",
                    kind: "tx",
                    label: "tx1",
                    full: "tx1aaaaaaaaaaaaaaaaaaaaaaaaaaaa",
                    amount: 0.52,
                    x: 0.30,
                    y: 0.38
                },
                {
                    id: "t:tx2",
                    kind: "tx",
                    label: "tx2",
                    full: "tx2bbbbbbbbbbbbbbbbbbbbbbbbbbbb",
                    amount: 1.25,
                    x: 0.70,
                    y: 0.38
                },
                {
                    id: "i:ip1",
                    kind: "ip",
                    label: "203.0.113.7",
                    full: "203.0.113.7",
                    country: "NL",
                    asn: 64500,
                    org: "Demo Hosting",
                    x: 0.50,
                    y: 0.85
                },
                {
                    id: "a:64500",
                    kind: "asn",
                    label: "AS64500",
                    full: "AS64500",
                    org: "Demo Hosting",
                    x: 0.50,
                    y: 0.98
                }
            ],
            edges: [
                { s: "w:walletB", t: "t:tx1", kind: "spend", amount: 0.52 },
                { s: "t:tx1", t: "w:walletA", kind: "pay", amount: 0.52 },
                { s: "w:walletA", t: "t:tx2", kind: "spend", amount: 1.25 },
                { s: "t:tx2", t: "w:walletC", kind: "pay", amount: 1.25 },
                { s: "i:ip1", t: "t:tx1", kind: "seen", amount: null },
                { s: "i:ip1", t: "t:tx2", kind: "seen", amount: null },
                { s: "i:ip1", t: "a:64500", kind: "in_asn", amount: null }
            ]
        };

        var log = document.getElementById("log");

        function showNodeDetails(node) {
            var lines = [
                "Selected node",
                "Type: " + (node.kind || "Not available"),
                "ID: " + (node.id || "Not available"),
                "Label: " + (node.label || "Not available"),
                "Full value: " + (node.full || "Not available"),
                "Risk score: " + (
                    typeof node.risk === "number"
                        ? node.risk
                        : "Not available"
                ),
                "Country: " + (node.country || "Not available"),
                "ASN: " + (node.asn ?? "Not available"),
                "Organization: " + (node.org || "Not available"),
                "Amount (BTC): " + (
                    typeof node.amount === "number"
                        ? node.amount
                        : "Not available"
                )
            ];

            log.textContent = lines.join("\n");
        }

        if (window.CryptonomeGraph && typeof window.CryptonomeGraph.render === "function") {
            window.CryptonomeGraph.render(
                document.getElementById("g"),
                payload,
                {
                    height: 480,
                    onSelect: showNodeDetails
                }
            );
        } else {
            log.textContent =
                "Could not load graph.js. Check that the script path is correct.";
            console.error("CryptonomeGraph.render is not available.");
        }
    </script>
</body>

</html>
